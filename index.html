<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SquadFinder</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#030a06;--tx:#ffffff;--mt:#c2dccd;--gl:#0e1d15;--gl2:#152b1f;--bd:rgba(160,255,200,.24);--hb:rgba(3,10,6,.88);--g:#22e58a;--g2:#10b981;--lm:#c6f432;--sh:0 14px 44px rgba(0,0,0,.5)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#e6f3eb;--tx:#011407;--mt:#2f4d3d;--gl:#ffffff;--gl2:#ffffff;--bd:rgba(6,70,30,.2);--hb:rgba(230,243,235,.92);--sh:0 8px 26px rgba(16,90,50,.14)}:root:not([data-theme=dark]) .bg i{opacity:.12!important}}
:root[data-theme=light]{--bg:#e6f3eb;--tx:#011407;--mt:#2f4d3d;--gl:#ffffff;--gl2:#ffffff;--bd:rgba(6,70,30,.2);--hb:rgba(230,243,235,.92);--sh:0 8px 26px rgba(16,90,50,.14)}:root[data-theme=light] .bg i{opacity:.12!important}
/* палитра B: фон-пятна тише, карточки сплошные (размытие под ними не нужно) */
.bg{opacity:.42}:root[data-theme=light] .bg{opacity:1}@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .bg{opacity:1}}
.box,.li,.stat div,.card,.tabs,.lang,.fbb{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.34;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#10b981;left:-20vmax;top:-22vmax}.bg i:nth-child(2){background:#a3e635;right:-26vmax;top:30vh;animation-duration:24s;opacity:.2}.bg i:nth-child(3){background:#06b6d4;left:8vmax;bottom:-32vmax;animation-duration:30s;opacity:.2}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#app{max-width:480px;margin:auto;padding:0 14px 130px}
button,input,textarea{font-family:Manrope,system-ui,sans-serif}
h1,h2,.logo,.nm,.stat b,.sq,.ph i,.mmc h2{font-family:Unbounded,Manrope,sans-serif}
h1{font-size:30px;line-height:1.14;letter-spacing:-.02em;font-weight:700;background:linear-gradient(120deg,var(--tx) 30%,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;letter-spacing:-.01em;font-weight:600}
.mt{color:var(--mt);font-size:13px;margin:6px 0 16px}
.hd{position:sticky;top:0;z-index:5;max-width:480px;margin:auto;padding:10px 14px;background:var(--hb);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-bottom:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:0}
.logo i{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--g),var(--lm));box-shadow:0 0 18px #22e58a88;position:relative}.logo i::after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.lang{display:flex;background:var(--gl);border:1px solid var(--bd);border-radius:999px;padding:3px}.lang span{padding:4px 11px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;color:var(--mt);transition:.25s}.lang .on{background:linear-gradient(135deg,var(--g),var(--lm));color:#05220f}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:4px}
.tabs::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);border-radius:12px;background:linear-gradient(135deg,var(--g),var(--lm));transform:translateX(calc(var(--i)*100%));transition:transform .45s cubic-bezier(.3,1.3,.5,1);box-shadow:0 4px 18px #22e58a66}
.tab{position:relative;background:none;border:0;padding:10px 0;font-size:13px;font-weight:600;color:var(--mt);cursor:pointer;transition:color .25s}.tab.on{color:#05220f}
#app.in>*:not(.act){animation:in .55s cubic-bezier(.2,.8,.2,1) backwards}
#app.in>*:nth-child(2){animation-delay:.05s}#app.in>*:nth-child(3){animation-delay:.1s}#app.in>*:nth-child(4){animation-delay:.15s}#app.in>*:nth-child(5){animation-delay:.2s}#app.in>*:nth-child(6){animation-delay:.25s}#app.in>*:nth-child(n+7){animation-delay:.3s}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}}
.box{background:var(--gl);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:16px;margin:16px 0}
.feat{display:flex;gap:14px;align-items:center;margin:12px 0}.ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;background:linear-gradient(135deg,#22e58a33,#c6f43233);border:1px solid var(--bd);flex:none}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,var(--g),var(--lm));color:#05220f;font-size:14px;font-weight:700;padding:15px;box-shadow:0 10px 28px #22e58a55,inset 0 1px 0 #fff8;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-130%);animation:sh 3.4s ease-in-out infinite}
@keyframes sh{60%,100%{transform:translateX(130%)}}
.btn svg{flex:none}.btn.alt svg{color:#ff5d73}.btn:active{transform:scale(.96)}.btn.alt{background:var(--gl2);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}.btn.alt::after{display:none}.btn:disabled{opacity:.4;filter:grayscale(.6);box-shadow:none}.btn:disabled::after{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;line-height:1.2;border:1px solid var(--bd);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;background:var(--gl);margin:0 5px 5px 0;white-space:nowrap}
.tag.on{background:var(--lm);color:#1a2a00;border-color:transparent}.tag.g{background:linear-gradient(135deg,#22e58a2e,#c6f4322e);border-color:#22e58a66}
.tag.pick{cursor:pointer;padding:8px 13px;transition:.2s}.tag.pick.on{background:linear-gradient(135deg,var(--g),var(--lm));box-shadow:0 4px 16px #22e58a55;transform:translateY(-1px)}
.fl{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.li{display:flex;align-items:center;gap:13px;border:1px solid var(--bd);border-radius:18px;background:var(--gl);backdrop-filter:blur(14px);padding:14px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font:inherit;font-weight:600;color:inherit;transition:transform .2s,box-shadow .25s,background .25s}
.li:active{transform:scale(.98)}.li.on{border-color:var(--g);background:linear-gradient(135deg,#22e58a26,#c6f43217);box-shadow:0 0 0 1px var(--g),0 10px 28px #22e58a30}
.li .ck{width:24px;height:24px;border:2px solid var(--bd);border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;transition:.25s}.li.rd .ck{border-radius:50%}
.li.on .ck{background:var(--g);border-color:var(--g);color:#05220f;animation:pop .35s}@keyframes pop{50%{transform:scale(1.35)}}
.li small{display:block;color:var(--mt);font-weight:500;margin-top:2px}
input,textarea{width:100%;background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:14px;font:inherit;color:var(--tx);outline:0;transition:.25s}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:10px;padding:0;border:0;border-radius:9px;background:linear-gradient(90deg,var(--g),var(--lm)) 0/var(--p,30%) 100% no-repeat,var(--gl2)}
input[type=range]:focus{box-shadow:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid var(--g);box-shadow:0 4px 16px #22e58a99;cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--g);box-shadow:0 4px 16px #22e58a99;cursor:pointer}
input:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 4px #22e58a26}
label.l{display:block;font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin:16px 0 8px;color:var(--mt)}
.stp{display:flex;align-items:center;background:var(--gl);border:1px solid var(--bd);border-radius:18px;width:fit-content;overflow:hidden}.stp button{width:50px;height:50px;border:0;background:none;color:var(--g);font:700 24px Sora;cursor:pointer}.stp button:active{background:#22e58a22}.stp span{width:70px;text-align:center;font:700 20px Sora}
.prog{height:6px;border-radius:9px;background:var(--gl2);margin:14px 0 10px;overflow:hidden}.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g),var(--lm));transition:width .6s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 14px var(--g)}
.sh small{color:var(--g);font-weight:700;letter-spacing:.1em}
.act{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--hb);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--bd);z-index:6}
.act .btn:first-child{width:84px}.act .btn:last-child{flex:1}
.chips{display:flex;flex-wrap:wrap;margin:16px 0 12px}
.card{position:relative;border-radius:30px;overflow:hidden;background:var(--gl);border:1px solid var(--bd);box-shadow:var(--sh);touch-action:pan-y;will-change:transform;margin-bottom:16px}
#cd{animation:in .5s cubic-bezier(.2,.8,.2,1) backwards}
.ph{position:relative;aspect-ratio:4/5;background-color:#0a1510;background-image:radial-gradient(circle at 30% 20%,#22e58a55,transparent 60%),linear-gradient(160deg,#0d3b27,#06100b);background-size:cover;background-position:center;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center}
.ph i{font:700 110px Unbounded;font-style:normal;background:linear-gradient(135deg,var(--g),var(--lm));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px #22e58a99)}
.ph>.tag{position:absolute;left:14px;top:14px;margin:0;background:rgba(0,0,0,.42);backdrop-filter:blur(10px);color:#fff;border-color:rgba(255,255,255,.25)}
.ov{position:absolute;left:0;right:0;bottom:0;padding:80px 18px 16px;background:linear-gradient(to top,rgba(2,10,6,.94),transparent);color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.nm{font-size:22px;font-weight:600;letter-spacing:-.01em}
.stamp{position:absolute;top:22%;left:50%;display:flex;align-items:center;gap:9px;padding:11px 20px;border-radius:999px;font:800 16px Manrope,sans-serif;letter-spacing:.01em;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-50%)}
.stamp.l{background:linear-gradient(135deg,var(--g),var(--lm));color:#05220f;box-shadow:0 10px 34px #22e58a99}
.stamp.n{background:#ff5d73;color:#fff;box-shadow:0 10px 34px #ff5d7388}
.in{padding:14px 16px 8px}.rl{margin-top:6px}.ab{margin:10px 0 8px;color:var(--mt)}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;margin-top:6px}
.ulink{text-align:center;margin-top:18px;cursor:pointer;color:var(--mt);font-weight:600;font-size:13px}
.empty{text-align:center;padding:44px 16px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat div{background:var(--gl);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:20px;padding:14px 8px;text-align:center;color:var(--mt);font-size:12px}.stat b{display:block;font-size:24px;font-weight:600;background:linear-gradient(135deg,var(--g),var(--lm));-webkit-background-clip:text;background-clip:text;color:transparent}
.sq{width:100px;height:100px;border-radius:28px;border:4px solid var(--bg);background-color:var(--g);background-image:linear-gradient(135deg,var(--g),var(--lm));background-size:cover;background-position:center;background-repeat:no-repeat;margin:-50px 0 0 18px;position:relative;display:flex;align-items:center;justify-content:center;font:700 34px Unbounded;color:#05220f;box-shadow:0 10px 30px #22e58a55}
table{width:100%;border-collapse:collapse}td{border-top:1px solid var(--bd);padding:10px 4px 10px 0;vertical-align:top;font-size:13px}tr:first-child td{border:0}td:first-child{font-weight:700;width:74px}
.bst{border-color:#c6f43255;background:linear-gradient(135deg,#22e58a1f,#c6f4320f)}
.bh{display:flex;gap:12px;align-items:center;margin-bottom:12px}.bh .bi{font-size:32px;flex:none}
.bon{color:var(--g);font-weight:800;font-size:13.5px}
.tk{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--gl2);border:1px solid var(--bd);font-weight:800;font-size:15px}
.rw{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:#22e58a22;color:var(--g);font-size:11.5px;font-weight:800;vertical-align:middle}
.r2{display:flex;gap:10px;margin-top:12px}.r2 .btn{padding:12px 8px;font-size:12.5px;flex:1}
.mdn b{color:var(--g)}
.lk{position:absolute;right:14px;top:14px;padding:6px 12px;border-radius:999px;background:linear-gradient(135deg,var(--g),var(--lm));color:#05220f;font:800 12px Manrope,sans-serif;box-shadow:0 6px 20px #22e58a88}

/* иконки игр, значки званий, строки игр */
.gi{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--z,38px);height:var(--z,38px);border-radius:calc(var(--z,38px)*.32);background:var(--ca,transparent);border:1px solid var(--cb,var(--c));color:var(--c)}
.gi svg{width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tag .gi{--z:18px;margin:0 -2px 0 -5px;border:0;background:transparent}.tag .gi svg{width:100%;height:100%}
.gl,.gr{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--bd)}.gl:first-child,.gr:first-child{border:0}
.gx{min-width:0;flex:1}.gh{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:14px}.gh b{font-weight:800}
.gs{margin-top:5px;color:var(--mt);font-size:12.5px}
.rk{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:800;font-size:12.5px;color:var(--c);background:var(--ca,transparent);border:1px solid var(--cb,var(--c))}
.rk::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 9px var(--c)}
/* статус «ищу сквад» */
.st{display:inline-flex;align-items:center;gap:7px;margin:0 0 6px;font-size:12px;font-weight:800;color:var(--g)}
.st i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 #22e58a99;animation:pls 1.8s infinite}@keyframes pls{70%{box-shadow:0 0 0 8px #22e58a00}100%{box-shadow:0 0 0 0 #22e58a00}}
.st.off{color:var(--mt)}.st.off i{background:var(--mt);animation:none}
.sw{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;width:100%;background:none;border:0;color:var(--tx);font:inherit;padding:0}
.sw .kn{flex:none;width:48px;height:28px;border-radius:99px;background:var(--gl2);border:1px solid var(--bd);position:relative;transition:.25s}.sw .kn::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s cubic-bezier(.3,1.6,.5,1)}
.sw.on .kn{background:linear-gradient(135deg,var(--g),var(--lm));border-color:transparent}.sw.on .kn::after{transform:translateX(20px)}
.sw small{display:block;color:var(--mt);font-size:12px;margin-top:2px}
/* шапка профиля и эффекты */
.banner{position:absolute;inset:0;overflow:hidden;isolation:isolate}
.banner .bgl{position:absolute;inset:-8px;background-size:cover;background-position:center;z-index:-3}
.banner .tint{position:absolute;inset:0;mix-blend-mode:color;opacity:.8;z-index:-2}
.banner .rim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1}
.banner .gbig{position:absolute;right:16px;top:50%;width:min(86px,70%);height:auto;transform:translateY(-50%) rotate(-8deg);opacity:.42;z-index:-1;filter:drop-shadow(0 0 14px currentColor)}
.bnw.sm{height:70px;margin-top:0;border-radius:18px;clip-path:inset(0 round 18px)}.bnw.sm .gbig{width:56px}.cb{position:relative;height:250px;-webkit-mask-image:linear-gradient(#000 50%,rgba(0,0,0,.6) 76%,transparent 100%);mask-image:linear-gradient(#000 50%,rgba(0,0,0,.6) 76%,transparent 100%)}
.cb .bnw{height:100%;margin:0;border-radius:0;clip-path:none}.cb .banner .gbig{width:116px;right:22px}
.card.hb .ph{position:relative;z-index:1;margin:-100px 14px 0;border-radius:26px;aspect-ratio:1/1;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 3px var(--bg),0 0 0 5px var(--glow,transparent),0 0 36px 2px var(--glow,transparent)}
.card.hb .ph>.stamp{z-index:3}.card.hb .in{padding-top:18px}
.sws button.x{background:var(--gl2);color:var(--mt);font-size:15px;font-weight:800;display:grid;place-items:center;border:1px dashed var(--bd)}
.tg{display:grid;place-items:center}
.banner .fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bnw .bedit{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.38);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer}
.fx-snow i,.fx-rain i{position:absolute;top:-16px;animation:snowf linear infinite}
.fx-snow i{border-radius:50%;background:#fff;opacity:.85;filter:blur(.4px)}
.fx-rain i{width:1.5px;height:16px;background:linear-gradient(transparent,#dff);opacity:.7;animation-name:rainf}
@keyframes snowf{to{transform:translate(14px,270px)}}@keyframes rainf{to{transform:translate(-14px,280px)}}
.bn-glitch .bgl{animation:glb 3.2s steps(1) infinite}
@keyframes glb{0%,90%,100%{transform:none;filter:none}91%{transform:translateX(-6px);filter:hue-rotate(90deg) saturate(2.2)}93%{transform:translateX(7px) skewX(8deg);filter:hue-rotate(-70deg)}95%{transform:translateX(-3px);filter:contrast(1.6)}97%{transform:none;filter:none}}
.fx-glitch i{position:absolute;left:0;right:0;height:7px;background:rgba(255,255,255,.28);mix-blend-mode:overlay;animation:gbar 3.2s steps(1) infinite;opacity:0}
.fx-glitch i:nth-child(1){top:18%}.fx-glitch i:nth-child(2){top:46%;animation-delay:.06s}.fx-glitch i:nth-child(3){top:72%;animation-delay:.12s}
@keyframes gbar{0%,90%,100%{opacity:0}91%,95%{opacity:1;transform:translateX(12px)}93%{opacity:1;transform:translateX(-16px)}}
.fx-aurora{background:linear-gradient(115deg,transparent 15%,rgba(110,255,200,.5) 38%,rgba(170,110,255,.45) 62%,transparent 85%);background-size:260% 100%;filter:blur(10px);mix-blend-mode:screen;animation:aur 7s ease-in-out infinite alternate}
@keyframes aur{from{background-position:0 0}to{background-position:100% 0}}
.fx-neon{background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 2px,transparent 2px 4px)}
.fx-neon::after{content:'';position:absolute;left:0;right:0;height:34px;top:-34px;background:linear-gradient(transparent,rgba(120,255,200,.45),transparent);animation:scan 3s linear infinite}
@keyframes scan{to{transform:translateY(160px)}}
.bn-neon .bgl{animation:nglow 2.4s ease-in-out infinite alternate}@keyframes nglow{from{filter:brightness(1)}to{filter:brightness(1.3) saturate(1.3)}}
.sws{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}.sws button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .2s}.sws button.on{border-color:var(--tx);transform:scale(1.14)}
.fxc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* значки за миссии */

  if(!mode){if(Math.abs(ax)<8&&Math.abs(ay)<8)return;mode=Math.abs(ax)>Math.abs(ay)*1.2?1:2;if(mode==1)c.style.transition='none'}

 if(e.key=='Escape'){if(modal){modal.remove();e.preventDefault()}else if($('#shm')){closeSheet();e.preventDefault()}return}
 if(e.key=='Enter'){
  if(modal){if(document.querySelector('.fbm')&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendFb()}return}
  if($('#shm')){if(e.ctrlKey||e.metaKey){e.preventDefault();saveSheet()}else if(tag=='INPUT'&&tg.type!='file'&&tg.blur)tg.blur();return}
  if(tag=='BUTTON'||tag=='A'||tag=='LABEL'||(tag=='INPUT'&&tg.type=='file'))return; // на кнопке Enter нажимает её сам
  if(tag=='TEXTAREA'&&!(e.ctrlKey||e.metaKey))return; // в «О себе» Enter — новая строка
  if(S.view=='welcome'){e.preventDefault();S.view='onb';S.step=1;save();R();return}
  if(S.view=='onb'){e.preventDefault();if(ok()){if(tg.blur)tg.blur();nxt()}else toast(t('Заполни обязательные поля','Fill in the required fields'));return}
 }
 if(!modal&&!typing&&!$('#shm')&&S.view=='feed'&&Q[qi]){if(e.key=='ArrowRight'){e.preventDefault();fly(1)}else if(e.key=='ArrowLeft'){e.preventDefault();fly(0)}}});
setInterval(checkMatches,20000);
setInterval(updHB,60000); // таймер буста в шапке
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkMatches()});
</script>
<script>
/* Загрузчик: скрипт Telegram грузится без блокировки страницы. Если telegram.org недоступен (бывает без VPN),
   через 3 секунды приложение стартует само: initData берётся из адреса, "ready" отправляется напрямую в Telegram. */
(function(){var started=0;
 function boot(){if(started)return;started=1;
  if(!(window.Telegram&&window.Telegram.WebApp)){
   var q=null;try{q=new URLSearchParams(location.hash.slice(1))}catch(e){}
   var post=function(ev,data){try{var d=data||{};
     if(window.TelegramWebviewProxy&&TelegramWebviewProxy.postEvent)TelegramWebviewProxy.postEvent(ev,JSON.stringify(d));
     else if(window.external&&'notify' in window.external)window.external.notify(JSON.stringify({eventType:ev,eventData:d}));
     else if(window.parent!==window)window.parent.postMessage(JSON.stringify({eventType:ev,eventData:d}),'*')}catch(e){}};
   window.Telegram={WebApp:{initData:(q&&q.get('tgWebAppData'))||'',ready:function(){post('web_app_ready')},expand:function(){post('web_app_expand')}}};}
  var s=document.createElement('script');s.textContent=document.getElementById('app-src').textContent;document.body.appendChild(s)}
 var t=document.createElement('script');t.src='https://telegram.org/js/telegram-web-app.js';t.onload=boot;t.onerror=boot;document.head.appendChild(t);
 setTimeout(boot,3000)})();
</script></body></html>
