.mis{display:flex;gap:12px;align-items:center}.mis .pg{height:10px;border-radius:9px;background:var(--gl2);flex:1;overflow:hidden}.mis .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--lm));border-radius:9px;box-shadow:0 0 12px var(--g);transition:width 1s cubic-bezier(.2,.9,.3,1)}

.hint{font-size:12px;color:var(--mt);margin-top:8px}

.mmc{background:var(--hb);border:1px solid var(--g);border-radius:28px;padding:28px 24px;text-align:center;max-width:340px;width:100%;box-shadow:0 0 70px #22e58a55;animation:zoom .5s cubic-bezier(.2,1.4,.4,1)}@keyframes zoom{from{transform:scale(.6);opacity:0}}

<script>
const $=s=>document.querySelector(s),tgw=window.Telegram&&Telegram.WebApp;tgw&&(tgw.ready(),tgw.expand());
const API_FIXED=''; // постоянный адрес вашего сервера (https://...). Если пусто — адрес берётся из ?api= (его передаёт бот)
const API=(()=>{if(API_FIXED)return API_FIXED.replace(/\/$/,'');
 try{const a=new URLSearchParams(location.search).get('api');if(a){const u=new URL(a);if(u.protocol==='https:'&&u.hostname.endsWith('.trycloudflare.com'))return u.origin}}catch(e){}
 return ''})(); // пусто = демо-режим без сервера
let S;try{S=JSON.parse(localStorage.su2)}catch(e){}
S=S||{lang:'ru',view:'welcome',step:1,swipes:0,matches:0,p:{nick:'',age:18,gender:'m',games:[],skill:{},roles:{},goal:'fun',about:'',photo:''}};
const save=()=>{if(window.__del)return;try{localStorage.su2=JSON.stringify(S)}catch(e){}};
const t=(r,e)=>S.lang=='ru'?r:e,esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const e=$('#toast');e.textContent=m;e.className='on';setTimeout(()=>e.className='',2200)};
const hap=(k='light')=>{try{tgw&&tgw.HapticFeedback&&tgw.HapticFeedback.impactOccurred(k)}catch(e){}};
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.btn,.li,.tag,.tab,.stp button'))hap()});
const pushProfile=()=>api('/api/profile',{...S.p,lang:S.lang});
const api=(p,b)=>API?fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json','X-Init':(tgw&&tgw.initData)||''},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>null):Promise.resolve(null);

/* Данные игр (проверенные источники: Liquipedia, Valve/Epic/Riot, профильные гайды).
   Способы указать уровень (modes): num — число (max/div — предел ввода и «потолок» для сортировки), r — список званий */
const IX='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const IH='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
const MODES={
 premier:{n:['Premier — CS Rating','Premier — CS Rating'],num:{ph:'CS Rating',max:35000,div:25000}},
 faceit:{n:['Faceit — ELO','Faceit — ELO'],num:{ph:'Faceit ELO',max:6000,div:3000}},
 comp:{n:['Звание (Competitive)','Competitive rank'],r:['Silver','Gold Nova','Master Guardian','Legendary Eagle','Supreme','Global Elite']},
 mmr:{n:['MMR','MMR'],num:{ph:'MMR',max:15000,div:9000}},
 rank:{n:['Звание','Rank']}};
const TIERS=[[30000,'Gold','Золотой'],[25000,'Red','Красный'],[20000,'Pink','Розовый'],[15000,'Purple','Фиолетовый'],[10000,'Blue','Синий'],[5000,'Light Blue','Голубой'],[0,'Grey','Серый']];
const G={
'CS2':{modes:['premier','faceit','comp'],roles:[['IGL','Капитан','IGL'],['Entry','Энтри-фраггер','Entry fragger'],['AWPer','Снайпер','AWPer'],['Rifler','Рифлер','Rifler'],['Lurker','Люркер','Lurker'],['Support','Саппорт','Support'],['Anchor','Опорник','Anchor']]},
'Dota 2':{modes:['mmr'],roles:[['1','1 · Керри','1 · Carry'],['2','2 · Мид','2 · Midlaner'],['3','3 · Оффлейнер','3 · Offlaner'],['4','4 · Софт-саппорт','4 · Soft support'],['5','5 · Фулл-саппорт','5 · Hard support']]},
'Valorant':{modes:['rank'],r:['Iron','Bronze','Silver','Gold','Platinum','Diamond','Ascendant','Immortal','Radiant'],roles:[['Duelist','Дуэлянт','Duelist'],['Initiator','Инициатор','Initiator'],['Controller','Контроллер','Controller'],['Sentinel','Страж','Sentinel']]},
'Fortnite':{modes:['rank'],r:['Bronze','Silver','Gold','Platinum','Diamond','Elite','Champion','Unreal'],roles:[['IGL','Шотколлер','Shotcaller'],['Fragger','Фраггер','Fragger'],['Support','Саппорт','Support'],['Builder','Билдер','Builder'],['Flex','Скаут / универсал','Scout / flex']]},
'Deadlock':{modes:['rank'],r:['Initiate','Seeker','Acolyte','Sentinel','Mystic','Ritualist','Emissary','Oracle','Phantom','Ascendant','Eternus'],roles:[['P1','1 · Главный кэрри','1 · Main carry'],['P2','2 · Мид-кэрри','2 · Mid carry'],['P3','3 · Инициатор / Танк','3 · Initiator / Tank'],['P4','4 · Полусаппорт / Роумер','4 · Semi-support / Roamer'],['P5','5 · Саппорт команды','5 · Team support'],['P6','6 · Полный саппорт','6 · Full support']]}};
const GOALS=[['fun','Просто для фана','Just for fun','Без привязки к скиллу','No skill matching'],['ranked','Ранкед-стак','Ranked stack','Подбор по твоему уровню','Matched to your level'],['tour','Турниры','Tournaments','Подбор по твоему уровню','Matched to your level'],['team','Постоянная команда','Full team','Подбор по твоему уровню','Matched to your level']];

const ranksOf=(g,m)=>m=='comp'?MODES.comp.r:G[g].r,isNum=m=>!!(m&&MODES[m].num);

async function checkMatches(){if(window.__del||!API||!S.p.games.length||S.view=='welcome'||S.view=='onb')return;
 const r=await api('/api/matches',{});const it=(r&&r.items)||[];if(!it.length)return;
 it.forEach(m=>{S.matches++;showMatch({n:m.n},m.contact,m.username)});save();if(S.view=='profile')R()}
function askWrite(){try{if(API&&!S.wa&&tgw&&tgw.requestWriteAccess&&tgw.isVersionAtLeast&&tgw.isVersionAtLeast('6.9')){S.wa=1;save();tgw.requestWriteAccess(()=>{})}}catch(e){}}
function drag(){const c=$('#cd');if(!c)return;let x0=null;const sl=$('#sl'),sn=$('#sn');
 c.onpointerdown=e=>{x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition='none'};
 c.onpointermove=e=>{if(x0==null)return;const d=e.clientX-x0;c.style.transform=`translateX(${d}px) rotate(${d/22}deg)`;sl.style.opacity=Math.max(0,Math.min(d/90,1));sn.style.opacity=Math.max(0,Math.min(-d/90,1))};
 c.onpointerup=e=>{if(x0==null)return;const d=e.clientX-x0;x0=null;c.style.transition='transform .25s';if(d>100)swipe(1);else if(d<-100)swipe(0);else{c.style.transform='';sl.style.opacity=0;sn.style.opacity=0}}}


const PH=u=>`background-image:url(${u});background-size:cover;background-position:center;background-repeat:no-repeat`;
function rolesBox(g){const rs=S.p.roles[g]||[];return `<div class="box"><b style="font-size:16px">${g}</b><div style="margin-top:12px">${G[g].roles.map(r=>`<button class="li ${rs.includes(r[0])?'on':''}" onclick="togR('${g}','${r[0]}')"><span class="ck">${rs.includes(r[0])?'✓':''}</span>${t(r[1],r[2])}</button>`).join('')}</div></div>`}
function editView(){const p=S.p;
 return `<div class="sh" style="margin-top:20px"><small>${t('РЕДАКТИРОВАНИЕ','EDITING')}</small><h2>${t('Моя анкета','My profile')}</h2></div>
 <div class="box" style="display:flex;gap:16px;align-items:center">
  <div class="sq" style="margin:0;flex:none;${p.photo?PH(p.photo):''}">${p.photo?'':esc((p.nick||'?')[0]).toUpperCase()}</div>
  <div style="flex:1"><input type="file" accept="image/*" id="fl" onchange="photo(this)" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><label for="fl" class="btn alt" style="cursor:pointer">${p.photo?t('Сменить фото','Change photo'):t('Загрузить фото','Upload photo')}</label>${p.photo?`<div class="ulink" style="margin-top:12px" onclick="S.p.photo='';save();R()">${t('Убрать фото','Remove photo')}</div>`:''}</div></div>
 <label class="l">${t('Никнейм','Nickname')}</label><input value="${esc(p.nick)}" maxlength="20" enterkeyhint="next" oninput="S.p.nick=this.value;save();chk()">
 <label class="l" style="display:flex;justify-content:space-between;align-items:center"><span>${t('Возраст','Age')}</span><span class="tag g" id="ag" style="margin:0;font-size:13px">${p.age} ${t('лет','y.o.')}</span></label><input type="range" min="16" max="40" value="${p.age}" style="--p:${(p.age-16)/24*100}%" oninput="S.p.age=+this.value;this.style.setProperty('--p',(this.value-16)/24*100+'%');$('#ag').textContent=this.value+' '+t('лет','y.o.');save();chk()">
 <label class="l">${t('Пол','Gender')}</label>${[['m',t('Парень','Guy')],['f',t('Девушка','Girl')]].map(x=>`<button class="li rd ${p.gender==x[0]?'on':''}" onclick="S.p.gender='${x[0]}';save();R()"><span class="ck">${p.gender==x[0]?'●':''}</span>${x[1]}</button>`).join('')}
 <label class="l">${t('О себе','About')} <span id="cn">${p.about.length}/200</span></label><textarea rows="4" maxlength="200" oninput="S.p.about=this.value;$('#cn').textContent=this.value.length+'/200';save()" placeholder="${t('Прайм-тайм, любимые карты, манера игры...','Prime time, favorite maps, playstyle...')}">${esc(p.about)}</textarea>
 <label class="l">${t('Цель поиска','Looking for')}</label>${GOALS.map(x=>`<button class="li rd ${p.goal==x[0]?'on':''}" onclick="S.p.goal='${x[0]}';save();R()"><span class="ck">${p.goal==x[0]?'●':''}</span><div>${t(x[1],x[2])}<small>${t(x[3],x[4])}</small></div></button>`).join('')}
 <label class="l">${t('Игры','Games')}</label>${Object.keys(G).map(g=>`<button class="li ${p.games.includes(g)?'on':''}" onclick="togG('${g}')"><span class="ck">${p.games.includes(g)?'✓':''}</span><b>${g}</b></button>`).join('')}
 ${p.games.length?`<label class="l">${t('Уровень','Skill')}</label>${p.games.map(skillBox).join('')}<label class="l">${t('Роли (до двух в игре)','Roles (up to two per game)')}</label>${p.games.map(rolesBox).join('')}`:''}
 <div class="act"><button class="btn alt" onclick="editCancel()">✕</button><button class="btn" id="nx" ${okAll()?'':'disabled'} onclick="editSave()">${t('Сохранить изменения','Save changes')}</button></div>`}
function editStart(){S.bak=JSON.stringify(S.p);S.view='edit';save();R();scrollTo(0,0)}
function editCancel(){try{S.p=JSON.parse(S.bak)}catch(e){}delete S.bak;S.view='profile';save();R();scrollTo(0,0)}
function editSave(){if(!okAll())return toast(t('Заполни ник, уровень и роли для каждой игры','Fill in nickname, level and roles for each game'));
 delete S.bak;S.view='profile';save();pushProfile();R();scrollTo(0,0);toast(t('Анкета обновлена','Profile updated'))}

function profile(){const p=S.p;
 return `<div class="banner"></div><div class="sq" style="${p.photo?`background-image:url(${p.photo});background-size:cover;background-position:center;background-repeat:no-repeat`:''}">${p.photo?'':esc((p.nick||'?')[0]).toUpperCase()}</div>
 <div style="margin:12px 0 0"><h2 style="text-transform:uppercase">${esc(p.nick)}</h2><div style="margin-top:8px"><span class="tag">${p.gender=='m'?'♂':'♀'} ${p.age}</span>${p.games.map(g=>`<span class="tag g">${g}</span>`).join('')}</div></div>
 <div class="stat"><div><b class="cnt" data-n="${S.swipes}">0</b>${t('Свайпы','Swipes')}</div><div><b class="cnt" data-n="${S.matches}">0</b>${t('Мэтчи','Matches')}</div><div><b class="cnt" data-n="${p.games.length}">0</b>${t('Игры','Games')}</div></div>
 <div class="box"><table style="margin:0">${p.games.map(g=>`<tr><td>${g}</td><td>${esc(lvl(g,p.skill[g]))}<br><span style="color:var(--mt)">${(p.roles[g]||[]).map(r=>esc(roleName(g,r))).join(' · ')}</span></td></tr>`).join('')}</table></div>
 <div class="box"><span class="tag on">${t(GOALS.find(x=>x[0]==p.goal)[1],GOALS.find(x=>x[0]==p.goal)[2])}</span>${p.about?`<p class="ab" style="margin:8px 0 0">${esc(p.about)}</p>`:`<p class="ab" style="margin:8px 0 0">${t('Описание не заполнено','No description yet')}</p>`}</div>
 <button class="btn" style="margin-top:14px" onclick="editStart()">${t('Редактировать анкету','Edit profile')}</button>
 <button class="btn alt" style="margin-top:12px" onclick="S.view='onb';S.step=1;save();R()">${t('Пройти регистрацию заново','Redo onboarding')}</button>
 <button class="btn alt" style="margin-top:12px" onclick="askFb()">✉️ ${t('Обратная связь','Feedback')}</button>
 <div style="margin-top:14px">${adBanner()}</div>
 <div class="ulink" style="color:#ff6b7d" onclick="askDelete()">${t('Удалить профиль','Delete profile')}</div>`}

function tasks(){const T=[[t('Подпишись на канал','Join our channel'),t('Новости проекта и розыгрыши','Project news and giveaways'),0,1],[t('20 свайпов за день','20 swipes today'),t('Ежедневная активность в ленте','Daily feed activity'),Math.min(S.swipes,20),20],[t('Первый мэтч','First match'),t('Свайпай и получи взаимный лайк','Swipe and get a mutual like'),Math.min(S.matches,1),1]];
 return `<h2 style="margin:20px 0 4px">${t('Миссии','Missions')}</h2><p class="mt">${t('Выполняй задания и поднимай анкету выше','Complete missions to boost your profile')}</p>`+
 T.map(x=>`<div class="box"><b>${x[0]}</b><div class="mt" style="margin:4px 0 12px">${x[1]}</div><div class="mis"><div class="pg"><i style="width:${x[2]/x[3]*100}%"></i></div><span>${x[2]}/${x[3]}</span></div></div>`).join('')+`<button class="btn" onclick="go('feed')">${t('К ленте','To feed')} →</button>`}

if(!S.p.games.length&&['feed','profile','tasks'].includes(S.view))S.view='welcome';
S.view=='feed'?go('feed'):(R(),checkMatches());
/* Клавиатура: Enter — «Далее» / «Опубликовать» / «Сохранить», Ctrl+Enter — отправить отзыв или перейти из текстового поля, Esc — закрыть окно, ←/→ в ленте */
document.addEventListener('keydown',e=>{if(e.isComposing||e.altKey)return;
 const tg=e.target,tag=tg&&tg.tagName,modal=document.querySelector('.mm'),typing=tag=='TEXTAREA'||(tag=='INPUT'&&tg.type!='range');
 if(e.key=='Escape'){if(modal){modal.remove();e.preventDefault()}return}
 if(e.key=='Enter'){
  if(modal){if(document.querySelector('.fbm')&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendFb()}return}
  if(tag=='BUTTON'||tag=='A'||tag=='LABEL'||(tag=='INPUT'&&tg.type=='file'))return; // на кнопке Enter нажимает её сам
  if(tag=='TEXTAREA'&&!(e.ctrlKey||e.metaKey))return; // в «О себе» Enter — новая строка
  if(S.view=='welcome'){e.preventDefault();S.view='onb';S.step=1;save();R();return}
  if(S.view=='onb'){e.preventDefault();if(ok()){if(tg.blur)tg.blur();nxt()}else toast(t('Заполни обязательные поля','Fill in the required fields'));return}
  if(S.view=='edit'){e.preventDefault();if(tg.blur)tg.blur();editSave();return}
 }
 if(!modal&&!typing&&S.view=='feed'&&Q[qi]){if(e.key=='ArrowRight'){e.preventDefault();swipe(1)}else if(e.key=='ArrowLeft'){e.preventDefault();swipe(0)}}});
setInterval(checkMatches,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkMatches()});
</script></body></html>
